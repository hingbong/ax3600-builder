name: Build AX3600 (upstream)

on:
  workflow_dispatch:
    inputs:
      openwrt_repository:
        required: true
        type: string
        default: "openwrt/openwrt"
      branch:
        required: true
        type: string
        default: "main"
      openwrt_commit:
        required: false
        type: string
        description: "Comma-separated list of upstream OpenWrt commit SHAs to cherry-pick"

jobs:
  build_and_release:
    name: Build and Release AX3600
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          build-essential clang flex bison g++ gawk zstd \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget libelf-dev

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Show space
        run: df -h

      - name: Checkout builder
        uses: actions/checkout@v6

      - name: Pull OpenWrt source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.openwrt_repository }}
          ref: ${{ inputs.branch }}
          path: openwrt

      - uses: actions/cache/restore@v5
        id: cache-dl-restore
        name: Restore dl cache
        continue-on-error: true
        with:
          path: openwrt/dl
          key: dl-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            dl-${{ github.ref_name }}-

      - uses: actions/cache/restore@v5
        id: cache-host-restore
        name: Restore host/toolchain cache
        continue-on-error: true
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/build_dir/host
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/toolchain-*
          key: host-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            host-${{ github.ref_name }}-

      - name: Cherry-pick upstream commits
        if: inputs.openwrt_commit != ''
        working-directory: openwrt
        run: |
          set -e
          git remote add upstream https://github.com/openwrt/openwrt.git
          git fetch upstream
          IFS=',' read -ra COMMITS <<< "${{ inputs.openwrt_commit }}"
          for commit in "${COMMITS[@]}"; do
            echo "Cherry-picking OpenWrt commit $commit"
            git cherry-pick "$commit"
          done

      - name: Prepare tree
        run: |
          set -e
          cd openwrt
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          # Feed mirrors, default LAN IP, NTP servers, custom DNS feed
          bash "$GITHUB_WORKSPACE/openwrt.sh"

          # Disable the unused QCA9889 radio and its ath10k packages
          bash "$GITHUB_WORKSPACE/scripts/disable-ath10k-ax3600.sh"

          # Board overlay (sshd_config, uci-defaults, ...)
          mkdir -p files
          cp -rf "$GITHUB_WORKSPACE"/files/. files/

          git rev-parse --short HEAD > ../lastest-commit

      - name: Update and install feeds
        run: |
          set -e
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Let the Rust toolchain reuse a prebuilt CI LLVM instead of
          # building LLVM from source (hickory-dns is a Rust package).
          if [ -f feeds/packages/lang/rust/Makefile ]; then
            sed -i 's/llvm\.download-ci-llvm=false/llvm.download-ci-llvm=true/g' \
              feeds/packages/lang/rust/Makefile
            grep -n "download-ci-llvm" feeds/packages/lang/rust/Makefile || true
          fi

      - name: Configure
        run: |
          set -e
          cd openwrt
          cp "$GITHUB_WORKSPACE/configs/ax3600.config" .config
          make defconfig

      - name: Verify config
        run: |
          set -e
          cd openwrt
          missing=0
          for sym in \
            CONFIG_TARGET_qualcommax=y \
            CONFIG_TARGET_qualcommax_ipq807x=y \
            CONFIG_TARGET_qualcommax_ipq807x_DEVICE_xiaomi_ax3600=y \
            CONFIG_PACKAGE_luci=y \
            CONFIG_PACKAGE_luci-app-firewall=y \
            CONFIG_PACKAGE_hickory-dns=y \
            CONFIG_PACKAGE_odhcpd=y \
            CONFIG_PACKAGE_openssh-server=y \
            CONFIG_PACKAGE_wpad-openssl=y \
            CONFIG_PACKAGE_kmod-wireguard=y \
            CONFIG_PACKAGE_wireguard-tools=y ; do
            if ! grep -qx "$sym" .config; then
              echo "::error::$sym is missing after defconfig"
              missing=1
            fi
          done
          if grep -q 'CONFIG_PACKAGE_kmod-qca-nss' .config; then
            echo "::error::an NSS package leaked into the upstream config"
            missing=1
          fi
          exit "$missing"

      - name: Show config
        run: cat openwrt/.config

      - name: Download distfiles
        run: |
          cd openwrt
          make download -j$(nproc) V=s

      - name: Build tools
        run: |
          cd openwrt
          make tools/install -j $(nproc) V=s || \
          make tools/install V=s

      - name: Build toolchain
        run: |
          cd openwrt
          make toolchain/install -j $(nproc) V=s || \
          make toolchain/install V=s

      - name: Build target images
        run: |
          unset GITHUB_ACTIONS
          cd openwrt
          make -j $(nproc) V=s || \
          make V=s

      - name: Get revision
        run: |
          cd openwrt
          echo "Repository URL: $(git config --get remote.origin.url)" >> bodyFile
          echo "Git Reference: $(git rev-parse --abbrev-ref HEAD)" >> bodyFile
          echo "SHA: $(git log -1 --format='%H')" >> bodyFile
          echo "" >> bodyFile
          cat bin/targets/qualcommax/ipq807x/feeds.buildinfo >> bodyFile
          echo "" >> bodyFile

      - name: Prepare release files
        run: |
          cp openwrt/.config openwrt/bin/targets/qualcommax/ipq807x/buildconfig

      - name: Get the current date
        run: echo "NOW=$(date +%F-%H%M)" >> $GITHUB_ENV

      - name: Create a release
        uses: "ncipollo/release-action@v1"
        with:
          name: "Updated prebuilt images ${{ env.NOW }}"
          tag: "ax3600-${{ env.NOW }}"
          makeLatest: true
          bodyFile: openwrt/bodyFile
          artifacts: openwrt/bin/targets/qualcommax/ipq807x/*
          token: "${{ secrets.GITHUB_TOKEN }}"

      - uses: actions/cache/save@v5
        name: Save dl cache
        continue-on-error: true
        with:
          path: openwrt/dl
          key: dl-${{ github.ref_name }}-${{ github.run_number }}

      - uses: actions/cache/save@v5
        name: Save host/toolchain cache
        continue-on-error: true
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/build_dir/host
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/toolchain-*
          key: host-${{ github.ref_name }}-${{ github.run_number }}

      - name: Cleanup old cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh extension install actions/gh-actions-cache
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"

          echo "Fetching list of cache key"
          mapfile -t cacheKeysForPR < <(
            gh actions-cache list -R "$REPO" -B "$BRANCH" | cut -f 1 | grep -E '^(dl|host)-' || true
          )

          if [ ${#cacheKeysForPR[@]} -eq 0 ]; then
            echo "No dl/host caches found"
            exit 0
          fi

          mapfile -t dlKeys < <(printf '%s\n' "${cacheKeysForPR[@]}" | grep '^dl-' || true)
          mapfile -t hostKeys < <(printf '%s\n' "${cacheKeysForPR[@]}" | grep '^host-' || true)

          # Sort by numeric run_number suffix (newest first) and keep the newest
          mapfile -t dlKeys < <(
            printf '%s\n' "${dlKeys[@]}" |
            awk -F- 'NF {print $NF"\t"$0}' |
            sort -rn |
            cut -f2-
          )
          mapfile -t hostKeys < <(
            printf '%s\n' "${hostKeys[@]}" |
            awk -F- 'NF {print $NF"\t"$0}' |
            sort -rn |
            cut -f2-
          )

          echo "Deleting old caches, keep newest one per prefix..."
          if [ ${#dlKeys[@]} -gt 1 ]; then
            for ((i=1; i<${#dlKeys[@]}; i++)); do
              gh actions-cache delete "${dlKeys[$i]}" -R "$REPO" -B "$BRANCH" --confirm || true
            done
          fi

          if [ ${#hostKeys[@]} -gt 1 ]; then
            for ((i=1; i<${#hostKeys[@]}; i++)); do
              gh actions-cache delete "${hostKeys[$i]}" -R "$REPO" -B "$BRANCH" --confirm || true
            done
          fi

          echo "Done"
